<!-- LEFT PANEL -->

<rect
  x="35"
  y="90"
  width="465"
  height="410"
  rx="12"
  fill="#020817"
  stroke="#00F7FF"
  stroke-opacity="0.5"
/>

<text
  x="55"
  y="118"
  fill="#7CFF67"
  font-family="Courier New, monospace"
  font-size="12"
  font-weight="bold">

  IDENTITY // VERIFIED

</text>

<!-- SCANNER -->

<line
  x1="45"
  y1="140"
  x2="490"
  y2="140"
  stroke="#00F7FF"
  stroke-width="2"
  opacity="0.55"
  filter="url(#softGlow)">

  <animate
    attributeName="y1"
    values="140;485;140"
    dur="5s"
    repeatCount="indefinite"/>

  <animate
    attributeName="y2"
    values="140;485;140"
    dur="5s"
    repeatCount="indefinite"/>

</line>
